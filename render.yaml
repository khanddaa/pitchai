services:
  # ── Backend (FastAPI) ──────────────────────────────────────
  - type: web
    name: pitchai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
    plan: free

  # ── Frontend (React Static) ────────────────────────────────
  - type: web
    name: pitchai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    plan: free
